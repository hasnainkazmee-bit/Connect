[package]
name = "sunhub-mobile-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uniffi = "0.32.2"
url = "2"

[dev-dependencies]
tempfile = "3"
