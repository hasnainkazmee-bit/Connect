name: Connect checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sunhub
          POSTGRES_PASSWORD: sunhub_local
          POSTGRES_DB: sunhub_community_test
        ports: [5438:5432]
        options: >-
          --health-cmd "pg_isready -U sunhub -d sunhub_community_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node --test tests/job-history-model.test.mjs tests/project-activity-model.test.mjs tests/notification-routing.test.mjs
      - run: npx playwright install --with-deps chrome
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p sunhub-mobile-core
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from a restrictive source checkout
        run: |
          find . -path './.git' -prune -o -type f -exec chmod 600 {} +
          find . -path './.git' -prune -o -type d -exec chmod 700 {} +
          docker build -t connect-check .
      - name: Check non-root runtime files and dependencies
        run: |
          chmod 644 tests/container-runtime.mjs apps/android/app/src/main/assets/reaction-emojis.json
          docker run --rm --entrypoint node \
          --mount "type=bind,source=$PWD/tests/container-runtime.mjs,target=/tmp/container-runtime.mjs,readonly" \
          --mount "type=bind,source=$PWD/apps/android/app/src/main/assets/reaction-emojis.json,target=/tmp/reaction-emojis.json,readonly" \
          connect-check /tmp/container-runtime.mjs

  provider-matching:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sunhub
          POSTGRES_PASSWORD: sunhub_local
          POSTGRES_DB: connect_provider_matching_test
        ports: [5438:5432]
        options: >-
          --health-cmd "pg_isready -U sunhub -d connect_provider_matching_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://sunhub:sunhub_local@127.0.0.1:5438/connect_provider_matching_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build -w apps/api
      - run: node apps/api/dist/migrate.js
      - run: python3 tests/provider-capability-research.test.py
      - run: python3 tests/provider-publication.test.py
      - run: python3 tests/provider-profile-corrections.test.py
      - run: node --test tests/provider-enrichment.test.mjs tests/provider-matching.test.mjs tests/provider-source-publication.test.mjs tests/provider-profile-corrections.test.mjs
      - run: cargo test --locked -p connect-jobs
      - run: cargo build --locked -p connect-jobs
      - run: node tests/provider-matching-api.mjs
